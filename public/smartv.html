<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ed1c24" />
    <title>Turno actual - Claro</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/smartv.js" defer></script>
  </head>
  <body class="smart-tv-body">
    <main class="smart-tv-page">
      <section class="smart-tv-card" aria-labelledby="current-heading">
        <img src="/Logo-claro/logo-claro.png" alt="Claro" class="smart-tv-logo" />
        <h1 id="current-heading" class="smart-tv-title">TURNO ACTUAL</h1>
        <div id="turn-name" class="smart-tv-name" aria-live="polite">Cargando...</div>
        <div id="turn-position" class="smart-tv-position"></div>
        <p id="status" class="smart-tv-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
