<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ed1c24" />
    <link rel="icon" type="image/png" href="/Logo-claro/logo-claro.png" />
    <link rel="apple-touch-icon" href="/Logo-claro/logo-claro.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Turno actual</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/auth.js" defer></script>
    <script src="/turno.js" defer></script>
  </head>
  <body class="turn-display-body">
    <main class="turn-display-page">
      <section class="turn-display-card">
        <img src="/Logo-claro/logo-claro.png" alt="Claro" class="turn-display-logo" />
        <div id="turn-code" class="turn-display-code">TURNO: ---</div>
        <div id="turn-name" class="turn-display-name" aria-live="polite">Cargando...</div>
        <div id="turn-position" class="turn-display-position"></div>
        <p id="status" class="turn-display-status" role="status" aria-live="polite"></p>
        <div class="turn-display-controls">
          <button id="previous" class="turn-nav-button" type="button">⬅ Anterior</button>
          <button id="next" class="turn-nav-button" type="button">Siguiente ➡</button>
        </div>
        <button id="logout" class="small-button turn-logout" type="button">Cerrar sesión</button>
      </section>
    </main>
  </body>
</html>
