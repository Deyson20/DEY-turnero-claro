<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ed1c24" />
    <link rel="icon" type="image/png" href="/Logo-claro/logo-claro.png" />
    <link rel="apple-touch-icon" href="/Logo-claro/logo-claro.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Iniciar sesión - Turnero Claro</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/login.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-card">
      <img src="/Logo-claro/logo-claro.png" alt="Claro" class="logo" />
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <label for="username">Usuario:</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Ingresar</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a href="/smartv.html">Abrir pantalla Smart TV</a>
    </main>
  </body>
</html>
